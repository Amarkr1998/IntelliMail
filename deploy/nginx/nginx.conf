worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Requests spend most of their time waiting on the AI provider (Azure
    # OpenAI), which can legitimately take tens of seconds - keep proxy
    # timeouts generous so a slow-but-successful generation isn't cut off.
    proxy_connect_timeout 10s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    upstream backend_upstream {
        server backend:8080;
    }

    upstream frontend_upstream {
        server frontend:8080;
    }

    server {
        listen 80;
        server_name _;

        # Domain validation webroot for Let's Encrypt/Certbot - see
        # deploy/scripts/init-letsencrypt.sh. Works today even without a real
        # domain (the location is just inert until certbot actually needs it).
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Deliberately NOT proxying /swagger-ui or /api-docs here - they stay
        # reachable only from inside the compose network (e.g.
        # `docker compose exec backend wget -qO- localhost:8080/swagger-ui.html`)
        # for internal debugging, never exposed to the public internet.

        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ---------------------------------------------------------------------
    # HTTPS activation (do this once you have a real domain pointed at this
    # server's IP - see DEPLOYMENT.md "SSL activation" section):
    #
    # 1. Replace every "your-domain.com" below with your real domain.
    # 2. Run deploy/scripts/init-letsencrypt.sh (issues the first certificate).
    # 3. Uncomment the "listen 80" redirect block below and the entire
    #    "server { listen 443 ... }" block.
    # 4. `docker compose exec reverse-proxy nginx -s reload`.
    #
    # server {
    #     listen 80;
    #     server_name your-domain.com;
    #
    #     location /.well-known/acme-challenge/ {
    #         root /var/www/certbot;
    #     }
    #
    #     location / {
    #         return 301 https://$host$request_uri;
    #     }
    # }
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
