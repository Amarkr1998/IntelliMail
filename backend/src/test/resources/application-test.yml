spring:
  datasource:
    url: jdbc:h2:mem:intellimail_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  ai:
    azure:
      openai:
        api-key: test-key
        endpoint: https://test.openai.azure.com
  # V21's spring_ai_chat_memory table is Flyway-owned and never gets created
  # here (Flyway is disabled above; Hibernate's create-drop only makes
  # @Entity-mapped tables) - excluded so tests fall back to
  # ChatMemoryAutoConfiguration's plain in-memory ChatMemoryRepository
  # instead. The real Postgres-backed persistence is verified live, not
  # through this H2-backed suite.
  autoconfigure:
    exclude:
      - org.springframework.ai.model.chat.memory.repository.jdbc.autoconfigure.JdbcChatMemoryRepositoryAutoConfiguration

intellimail:
  jwt:
    secret: test-secret-key-for-unit-tests-only-not-for-production-use
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
    issuer: intellimail-test
  mail:
    from-address: test-sender@intellimail-test.local
  app:
    frontend-url: http://localhost:5173
  google-oauth:
    client-id: test-google-client-id.apps.googleusercontent.com
  stripe:
    secret-key: sk_test_dummy
    webhook-secret: whsec_test_dummy
    price-id-starter: price_test_starter
    price-id-pro: price_test_pro
