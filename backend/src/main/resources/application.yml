spring:
  application:
    name: intellimail-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_FILE_SIZE:10MB}

  datasource:
    # DB_URL wins if set (native dev, Docker Compose). Otherwise built from
    # parts - lets a platform that hands out host/port/database separately
    # (e.g. Render's `fromDatabase` Blueprint references) wire in without
    # needing to construct a JDBC URL string itself.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:intellimail}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Explicit timeouts so a bad send (wrong credentials, network issue)
          # fails fast instead of hanging the request thread on the OS default
          # socket timeout, which can be minutes.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  ai:
    azure:
      openai:
        api-key: ${AZURE_OPENAI_API_KEY:}
        endpoint: ${AZURE_OPENAI_ENDPOINT:}
        chat:
          options:
            deployment-name: ${AZURE_OPENAI_DEPLOYMENT:gpt-4o}
            # No default temperature or max-tokens here: some Azure deployments
            # (newer reasoning-tier models) reject any non-default temperature
            # ("Only the default (1) value is supported") and reject the legacy
            # `max_tokens` parameter outright, requiring `max_completion_tokens`
            # instead - which Spring AI 1.0.0 doesn't yet expose. See
            # AzureOpenAiClient's class Javadoc for the full explanation. If your
            # deployment supports custom sampling params, re-add them here.
    # AI agent conversation memory (see agent/config/AgentMemoryConfig) is
    # backed by Postgres via spring-ai-starter-model-chat-memory-repository-jdbc.
    # Schema is owned by Flyway (V21) like every other table in this app -
    # never let this starter's own initializer create it too.
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never

  # ChatMemoryAutoConfiguration would otherwise register a second, unused
  # default in-memory ChatMemory/ChatMemoryRepository pair alongside the JDBC
  # ones AgentMemoryConfig actually wires up - excluded to remove any risk of
  # bean-resolution ambiguity rather than relying on by-name disambiguation.
  autoconfigure:
    exclude:
      - org.springframework.ai.model.chat.memory.autoconfigure.ChatMemoryAutoConfiguration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# management.server.port defaults to the same port as the app when
# MANAGEMENT_SERVER_PORT is unset, so native/dev usage is unchanged. When set to a
# different port (only done in the Docker monitoring overlay), actuator moves to
# its own embedded connector - but (verified against a real run) Spring Boot
# still reuses the same ApplicationContext/security beans there, so our custom
# SecurityFilterChain still applies. /actuator/prometheus is explicitly
# permitted in SecurityConfig's PUBLIC_ENDPOINTS for this reason (Prometheus
# can't present a JWT); safety instead comes from network isolation - this port
# is never published to the host or proxied by nginx, only reachable by other
# containers on the internal Docker network.
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:${server.port}}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    # Mail delivery is best-effort (forgot-password emails) and never
    # required for the app to serve traffic - the Docker healthcheck and
    # restart policy key off /actuator/health, so a transient SMTP outage
    # must not flip the whole container to unhealthy and get it restarted.
    mail:
      enabled: false

intellimail:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-min-256-bits-long-please}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}      # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
    issuer: intellimail
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,chrome-extension://*}
  mail:
    # Gmail validates/rewrites the From header against the authenticated
    # account, so this should normally just match MAIL_USERNAME.
    from-address: ${MAIL_FROM:${MAIL_USERNAME:}}
  app:
    # Used to build the password-reset link emailed to users.
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
  google-oauth:
    # Also used client-side by the frontend's GoogleLogin button - not a secret,
    # just an identifier, safe to be public. No client secret exists in this
    # app at all: ID-token verification never talks to Google server-to-server.
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    price-id-starter: ${STRIPE_PRICE_ID_STARTER:}
    price-id-pro: ${STRIPE_PRICE_ID_PRO:}
  ai:
    default-temperature: ${AZURE_OPENAI_TEMPERATURE:0.7}
    default-max-tokens: ${AZURE_OPENAI_MAX_TOKENS:1024}
    send-sampling-parameters: ${AI_SEND_SAMPLING_PARAMETERS:true}
    retry:
      max-attempts: 3
      backoff-ms: 500

logging:
  level:
    root: INFO
    com.intellimail: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
