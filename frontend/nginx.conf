server {
    # Unprivileged port - the container runs as a non-root user (binding <1024
    # requires CAP_NET_BIND_SERVICE, which is deliberately not granted; see
    # docker-compose.yml's cap_drop: ALL). The reverse-proxy talks to this
    # container over the internal Docker network, so the port number here is
    # an implementation detail, never internet-facing directly.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite's build hashes asset filenames, so they're safe to cache aggressively;
    # index.html itself must always be revalidated or deploys would get stuck
    # serving a stale shell that references old asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: let React Router handle any path that isn't a real static file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
