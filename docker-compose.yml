x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Full hardening for our own images (backend/frontend/reverse-proxy), where we
# control the entrypoint and already run as non-root without needing any
# elevated capabilities.
x-security-defaults: &security-defaults
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# The official postgres image's own entrypoint needs to chown/chmod the
# mounted data volume and switch from root to the `postgres` user at startup
# (CAP_CHOWN/CAP_SETUID/CAP_SETGID) before it ever runs untrusted SQL -
# dropping ALL capabilities breaks that bootstrap. no-new-privileges alone
# (which blocks privilege *escalation*, not this expected internal drop) is
# the right amount of hardening here; the running postgres process is
# already non-root by the image's own design.
x-security-defaults-db: &security-defaults-db
  security_opt:
    - no-new-privileges:true

networks:
  intellimail-net:
    driver: bridge

volumes:
  postgres_data:
  certbot_conf:
  certbot_www:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    <<: *security-defaults-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - intellimail-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Same tag CI pushes to GHCR (see .github/workflows/cd.yml) and
    # rollback.sh retags - `docker compose build` (local dev/verification)
    # just tags the freshly-built image with this same name locally; in
    # production, `docker compose pull` fetches the real published image
    # instead of building. Either way this is the single name Compose
    # actually runs.
    image: ghcr.io/amarkr1998/intellimail-backend:latest
    restart: unless-stopped
    <<: *security-defaults
    read_only: true
    tmpfs:
      - /tmp:size=128m
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}
      AI_SEND_SAMPLING_PARAMETERS: ${AI_SEND_SAMPLING_PARAMETERS}
      AZURE_OPENAI_TEMPERATURE: ${AZURE_OPENAI_TEMPERATURE}
      AZURE_OPENAI_MAX_TOKENS: ${AZURE_OPENAI_MAX_TOKENS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS}
      UPLOAD_MAX_FILE_SIZE: ${UPLOAD_MAX_FILE_SIZE}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      MANAGEMENT_SERVER_PORT: ${MANAGEMENT_SERVER_PORT:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:-${MAIL_USERNAME}}
      FRONTEND_URL: ${FRONTEND_URL}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_ID_STARTER: ${STRIPE_PRICE_ID_STARTER}
      STRIPE_PRICE_ID_PRO: ${STRIPE_PRICE_ID_PRO}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - intellimail-net
    healthcheck:
      # CMD-SHELL (not CMD) so $MANAGEMENT_SERVER_PORT is read from the
      # container's own environment at runtime: when the monitoring overlay
      # sets it, actuator (including /actuator/health) moves entirely off
      # 8080 onto that port - a hardcoded 8080 healthcheck would then always
      # fail once monitoring is enabled.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:${MANAGEMENT_SERVER_PORT:-8080}/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Measured for real on this machine: a cold Docker start (fresh JVM,
      # Flyway running all 11 migrations against a brand-new database) took
      # ~105s - notably slower than the ~10-14s seen running natively without
      # container overhead. 60s nearly wasn't enough (4 of 5 allowed failures
      # had already ticked by); 180s gives real margin on a small droplet too.
      start_period: 180s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    image: ghcr.io/amarkr1998/intellimail-frontend:latest
    restart: unless-stopped
    <<: *security-defaults
    read_only: true
    tmpfs:
      # Explicit uid/gid: tmpfs mounts default to root ownership, which would
      # shadow the Dockerfile's chown and block this container's non-root
      # `intellimail` user (uid 100/gid 102 - baked in via `adduser -S`) from
      # writing here at all.
      - /var/cache/nginx:uid=100,gid=102
      - /var/run:uid=100,gid=102
    networks:
      - intellimail-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging

  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Stock nginx image, not our own hardened build: the master process starts
    # as root and needs CAP_NET_BIND_SERVICE (port 80/443) plus
    # CAP_SETUID/CAP_SETGID to drop each worker to the unprivileged `nginx`
    # user - the same class of bootstrap `cap_drop: ALL` would break, as it
    # did for postgres above. no-new-privileges alone is the right amount of
    # hardening for this one.
    <<: *security-defaults-db
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - intellimail-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging

  # No long-running process by default (nothing to renew without a real
  # domain yet) - real work happens via one-off `docker compose run --rm
  # certbot ...` invocations from deploy/scripts/init-letsencrypt.sh, plus a
  # host crontab entry for renewal once HTTPS is activated (see DEPLOYMENT.md).
  certbot:
    image: certbot/certbot:latest
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "echo 'certbot: no-op, run via deploy/scripts/init-letsencrypt.sh' && exit 0"]
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - intellimail-net
    logging: *default-logging
